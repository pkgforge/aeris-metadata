# Where each icon in icons/ came from.
#
# This is a record, not a shopping list. The icons themselves are committed in
# icons/, and that is what gets packed and shipped. Nothing is fetched to build
# the archive.
#
# tools/fetch.py reads this to bring in an icon that is named here but not yet
# in icons/, which is what happens when somebody adds one. After that the file
# is the icon, and this line says where it came from.
#
# An icon from anywhere at all can be recorded: a project's own repository, a
# release asset, or "drawn by hand" for one that came from nowhere.

